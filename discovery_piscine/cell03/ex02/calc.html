<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's over 9000</title>
  <link rel="stylesheet" href="calc.css">
  <script src="calc.js" defer></script>
</head>
<body>
  <main class="calculator">
    <h1>It's over 9000</h1>
    <form id="calculator-form">
      <label for="left-number">First number</label>
      <input id="left-number" name="left-number" type="text" inputmode="numeric">

      <label for="operator">Operation</label>
      <select id="operator" name="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
      </select>

      <label for="right-number">Second number</label>
      <input id="right-number" name="right-number" type="text" inputmode="numeric">

      <input type="submit" value="Try me!">
    </form>
  </main>
</body>
</html>
