<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A two-person visual novel portfolio for the 42 Discovery Piscine Rush.">
  <title>After Class · Two Routes</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/tailwind.css">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="landing-page min-h-screen text-white antialiased">
  <a class="skip-link" href="#routes">Skip to route selection</a>

  <main class="route-stage" id="routes">
    <div class="route-stage__header">
      <h1>After Class</h1>
      <p class="route-stage__hint">Choose a route to open a portfolio.</p>
    </div>

    <div class="route-grid" aria-label="Choose a teammate">
      <a
        class="route-card route-card--sunset group"
        href="nunoi.html"
        data-dialogue-speaker="NunoiEnter"
        data-dialogue="I turn ideas into small, expressive web experiences. Want to see my chapter?"
      >
        <img src="assets/nunoi-route.png" alt="Anime guitarist representing NunoiEnter's portfolio route">
        <span class="route-card__shade" aria-hidden="true"></span>
        <span class="route-card__number">Route A</span>
        <span class="route-card__copy">
          <strong>NunoiEnter</strong>
          <small>Creative web explorer</small>
          <span class="route-card__action">Open chapter</span>
        </span>
      </a>

      <a
        class="route-card route-card--night group"
        href="partner.html"
        data-dialogue-speaker="Player Two"
        data-dialogue="Every strong team needs a second perspective. Continue to the partner route?"
      >
        <img src="assets/partner-route.png" alt="Anime guitarist representing the second teammate's portfolio route">
        <span class="route-card__shade" aria-hidden="true"></span>
        <span class="route-card__number">Route B</span>
        <span class="route-card__copy">
          <strong>Player Two</strong>
          <small>Frontend teammate</small>
          <span class="route-card__action">Open chapter</span>
        </span>
      </a>
    </div>

    <section class="dialogue-box" aria-live="polite" aria-atomic="true">
      <p class="dialogue-box__speaker" id="dialogue-speaker">Narrator</p>
      <p class="dialogue-box__line" id="dialogue-line">Two teammates. One rush. Choose whose story you want to read first.</p>
      <span class="dialogue-box__continue" aria-hidden="true"></span>
    </section>
  </main>
</body>
</html>
