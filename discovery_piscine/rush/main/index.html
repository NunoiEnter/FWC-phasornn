<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A two-person visual novel portfolio for the 42 Discovery Piscine Rush.">
  <title>RUSH PROJECT · Two Routes</title>
  <link rel="icon" href="../nunoi/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="main.css">
  <script src="main.js" defer></script>
</head>
<body class="min-h-dvh overflow-x-hidden bg-[#120f20] font-[DM_Sans,sans-serif] text-white antialiased lg:h-dvh lg:overflow-hidden">

  <a href="#routes" class="fixed top-3 left-3 z-[100] -translate-y-[180%] bg-[#74d5c5] px-4 py-3 font-bold text-[#171326] no-underline transition-transform duration-200 focus:translate-y-0">Skip to route selection</a>

  <main id="routes" class="relative isolate flex min-h-dvh flex-col px-4 py-6 lg:h-dvh lg:p-0">

    <!-- Header -->
    <div class="relative z-[5] mx-auto mb-6 w-full max-w-xl px-1 text-center lg:pointer-events-none lg:absolute lg:top-8 lg:left-1/2 lg:mb-0 lg:w-[min(90vw,36rem)] lg:-translate-x-1/2 lg:px-0">
      <h1 class="m-0 max-w-full font-[Newsreader,serif] text-[clamp(2.35rem,8vw,5.5rem)] leading-[0.95] tracking-[-0.035em] [text-shadow:0_0.35rem_1.8rem_rgba(0,0,0,0.48)]">RUSH PROJECT</h1>
      <p class="mt-2.5 mb-0 text-[0.72rem] font-bold tracking-[0.08em] text-[#fff2e4] [text-shadow:0_0.12rem_1rem_rgba(0,0,0,0.65)]">Choose a route to open a portfolio.</p>
    </div>

    <!-- Route cards -->
    <div class="grid flex-1 grid-cols-1 gap-3 lg:h-full lg:min-h-0 lg:grid-cols-2 lg:grid-rows-1 lg:gap-0" aria-label="Choose a teammate">

      <!-- Route A : Nunoi -->
      <a href="../nunoi/nunoi.html"
         data-dialogue-speaker="NunoiEnter"
         data-dialogue="Life and die with unix and visual novel"
         class="group relative block min-h-[18rem] overflow-hidden text-white no-underline sm:min-h-[22rem] lg:h-full lg:min-h-0 lg:border-r lg:border-white/35">
        <img src="../nunoi/assets/nunoi-route.png" alt="Anime guitarist representing Nunoi's portfolio route"
             class="absolute inset-0 h-full w-full object-cover object-[50%_43%] transition duration-700 ease-out group-hover:scale-[1.035] group-hover:saturate-[1.08] group-focus-visible:scale-[1.035] lg:object-center">
        <span aria-hidden="true" class="absolute inset-0 bg-gradient-to-b from-[#100c1c]/35 via-[#100c1c]/10 to-[#100c1c]/95"></span>
        <span class="absolute top-4 left-4 border-b border-white/60 pb-1.5 text-xs font-bold tracking-[0.12em] uppercase lg:top-8 lg:left-8">Route A</span>
        <span class="absolute right-5 bottom-5 left-5 grid gap-1 lg:right-10 lg:bottom-44 lg:left-10">
          <strong class="font-[Newsreader,serif] text-[clamp(2.1rem,6vw,5.5rem)] leading-[0.9] tracking-[-0.035em]">Monic@</strong>
          <small class="hidden font-semibold text-[#fff5e8] text-[0.92rem] sm:block">THE HOLY UNIX AND VN WEEB</small>
          <span class="mt-3 inline-flex min-h-11 w-max items-center gap-3 border border-white/60 bg-[#140f23]/55 px-4 py-3 text-[0.82rem] font-bold transition group-hover:bg-white group-hover:text-[#171326] lg:mt-5">Open chapter <span aria-hidden="true" class="inline-block h-2 w-2 rotate-45 border-t border-r border-current"></span></span>
        </span>
      </a>

      <!-- Route B : phurip -->
      <a href="../phurip/phurip.html"
         data-dialogue-speaker="phurip"
         data-dialogue="Least insane MacBook startup phurip"
         class="group relative block min-h-[18rem] overflow-hidden text-white no-underline sm:min-h-[22rem] lg:h-full lg:min-h-0">
        <img src="../phurip/assets/phurip-route.png" alt="Anime founder opening a glowing MacBook representing phurip's portfolio route"
             class="absolute inset-0 h-full w-full object-cover object-[50%_30%] transition duration-700 ease-out group-hover:scale-[1.035] group-hover:saturate-[1.08] group-focus-visible:scale-[1.035] lg:object-[58%_50%]">
        <span aria-hidden="true" class="absolute inset-0 bg-gradient-to-b from-[#100c1c]/35 via-[#100c1c]/10 to-[#100c1c]/95"></span>
        <span class="absolute top-4 left-4 border-b border-white/60 pb-1.5 text-xs font-bold tracking-[0.12em] whitespace-nowrap uppercase lg:top-8 lg:right-8 lg:left-auto">Route B</span>
        <span class="absolute right-5 bottom-5 left-5 grid gap-1 lg:right-10 lg:bottom-44 lg:left-10">
          <strong class="font-[Newsreader,serif] text-[clamp(2.1rem,6vw,5.5rem)] leading-[0.9] tracking-[-0.035em]">phuri__p</strong>
          <small class="hidden font-semibold text-[#fff5e8] text-[0.92rem] sm:block">MACBOOK STARTUP LARPER</small>
          <span class="mt-3 inline-flex min-h-11 w-max items-center gap-3 border border-white/60 bg-[#140f23]/55 px-4 py-3 text-[0.82rem] font-bold transition group-hover:bg-white group-hover:text-[#171326] lg:mt-5">Open chapter <span aria-hidden="true" class="inline-block h-2 w-2 rotate-45 border-t border-r border-current"></span></span>
        </span>
      </a>
    </div>

    <!-- VN dialogue box -->
    <section aria-live="polite" aria-atomic="true"
      class="relative z-[6] mt-4 w-full min-h-[7.25rem] border border-white/55 bg-[#171326]/95 py-5 pr-12 pl-5 shadow-[0_1.5rem_4rem_rgba(13,9,27,0.28)] backdrop-blur-sm before:pointer-events-none before:absolute before:inset-[0.3rem] before:border before:border-white/15 before:content-[''] lg:absolute lg:bottom-6 lg:left-1/2 lg:mt-0 lg:w-[min(calc(100%-3rem),58rem)] lg:min-h-[7.7rem] lg:-translate-x-1/2 lg:py-5 lg:pr-16 lg:pl-6">
      <p id="dialogue-speaker" class="relative z-[1] m-0 mb-2 text-xs font-bold tracking-[0.1em] text-[#74d5c5] uppercase">Narrator</p>
      <p id="dialogue-line" class="relative z-[1] m-0 text-[clamp(0.95rem,1.6vw,1.15rem)] leading-[1.55] text-[#fff9f0]">Two teammates. One rush. Choose whose story you want to read first.</p>
      <span aria-hidden="true" class="absolute right-[1.35rem] bottom-[1.1rem] z-[1] h-2 w-2 rotate-45 animate-[continue-pulse_1.3s_ease-in-out_infinite] border-r-2 border-b-2 border-[#ef735d]"></span>
    </section>
  </main>
</body>
</html>
