<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    table {
      width: 100%;
      height: 100vh;
      border-collapse: collapse;
      table-layout: fixed;
    }

    td {
      width: 50%;
      border: 1px solid #555;
      padding: 1rem;
      overflow-wrap: anywhere;
    }

    td:first-child {
      background-color: #c4cb7b;
    }

    td:last-child {
      background-color: #f7c0ab;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td>First cell</td>
      <td>Second cell</td>
    </tr>
  </table>
</body>
</html>
