<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Stella Sandwich Menu</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <main class="menu-card">
    <h1>Café Stella</h1>
    <p class="intro">喫茶ステラと死神の蝶 · Choose a sandwich for the journey.</p>

    <label class="menu-label" for="sandwich">Sandwich</label>
    <div class="select-wrap">
      <select id="sandwich" name="sandwich">
        <option value="ham-cheese">Ham &amp; cheese — €5.90</option>
        <option value="chicken-emmental">Chicken &amp; emmental — €6.50</option>
        <option value="tomato-mozzarella">Tomato &amp; mozzarella — €5.40</option>
        <option value="vegetable-hummus">Vegetable &amp; hummus — €5.20</option>
      </select>
    </div>
  </main>
</body>
</html>
