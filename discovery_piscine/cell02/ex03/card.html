<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NunoiEnter · Student Profile</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <main class="profile-card">
    <header class="card-header">
      <div class="school-mark" aria-hidden="true">42</div>
      <div class="header-copy">
        <strong>Student Profile</strong>
        <span>学生証 · Discovery Campus</span>
      </div>
    </header>

    <section class="identity" aria-labelledby="profile-name">
      <div class="portrait-frame">
        <img
          class="profile-picture"
          src="../../../../itkmitl/42/rofile.jpg"
          alt="Anime portrait used by NunoiEnter"
        >
      </div>

      <div class="identity-copy">
        <h1 id="profile-name">NunoiEnter</h1>
        <p>Creative web explorer</p>
      </div>
    </section>

    <table aria-label="Student profile details">
      <tbody>
        <tr>
          <th scope="row">Login</th>
          <td>@NunoiEnter</td>
        </tr>
        <tr>
          <th scope="row">About</th>
          <td>Learning through code and creative experiments.</td>
        </tr>
      </tbody>
    </table>

    <nav class="social-links" aria-label="Social profiles">
      <a href="https://github.com/NunoiEnter" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.7-1.6 6.7-7.3A5.7 5.7 0 0 0 19.2 3.3 5.3 5.3 0 0 0 19 .3S17.9-.1 15 1.8a13.4 13.4 0 0 0-7 0C5.1-.1 3.9.3 3.9.3a5.3 5.3 0 0 0-.1 3A5.7 5.7 0 0 0 2.3 7.2c0 5.7 3.4 6.9 6.7 7.3A4.8 4.8 0 0 0 8 18v4"></path>
          <path d="M8 19c-3 .9-3-1.5-4-2"></path>
        </svg>
        <span>GitHub</span>
      </a>

      <a href="https://www.instagram.com/monixflake.os/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle class="icon-dot" cx="17.5" cy="6.5" r="1"></circle>
        </svg>
        <span>Instagram</span>
      </a>

      <a href="https://x.com/m0nxka" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4l14 16"></path>
          <path d="M19 4L5 20"></path>
        </svg>
        <span>X</span>
      </a>
    </nav>



    <footer>42 Discovery Piscine · Cell 02</footer>
  </main>
</body>
</html>
